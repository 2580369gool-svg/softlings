name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：只需要读代码和上传产物
permissions:
  contents: read

jobs:
  # 诊断作业：只跑 shell，不引用任何第三方 Action。
  # 用途是二分定位 —— 如果连它都零步骤失败，说明问题在账号或运行器层面，
  # 和 workflow 配置无关；如果它成功而 apk 失败，那问题就出在 Action 上。
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 裸运行器自检
        run: |
          echo "✅ shell 步骤可以执行"
          uname -a
          echo "ANDROID_HOME=${ANDROID_HOME:-<未设置>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<未设置>}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null | head -8 || echo "(SDK 目录不可读)"
          java -version 2>&1 | head -2 || echo "(无 java)"
          df -h / | tail -1

  # 打包和测试拆成两个并行作业，互不阻塞。
  # 理由：测试依赖 CI 环境的 Chrome，一旦环境有差异就会连累 APK 出不来。
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: 环境信息
        run: |
          echo "--- Java ---"
          java -version
          echo "--- Android SDK ---"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null || echo "(SDK 目录不存在)"
          echo "--- 磁盘 ---"
          df -h /

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      - name: 同步到安卓工程
        run: npx cap sync android

      # Windows 上的 Git 不保留可执行位，gradlew 到 Linux 上就没有执行权限。
      # 少了这一行，构建会以 "Permission denied" 失败。
      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 检查产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v7
        with:
          name: softlings-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # 质量门禁：数值模拟 + 渲染冒烟 + 安卓工程校验。
  # 失败不影响 apk 作业，但会在 Actions 页面标红，保证坏代码不会被忽视。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物（冒烟测试需要 dist）
        run: npm run build

      - name: 跑测试
        run: npm run check
