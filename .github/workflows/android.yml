name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最小权限：工作流只需要读代码和上传产物。
# 显式声明可以避免仓库默认权限设成只读时，第三方 Action 拿不到必要的授权。
permissions:
  contents: read

jobs:
  # 打包和测试拆成两个并行作业，互不阻塞。
  # 理由：测试依赖 CI 环境的 Chrome，一旦环境有差异就会连累 APK 出不来。
  # 拆开之后，测试失败只说明测试环境有问题，不会让你拿不到包。
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 环境信息
        run: |
          echo "--- Java ---"
          java -version
          echo "--- Android SDK ---"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" 2>/dev/null || echo "(SDK 目录不存在)"
          echo "--- 磁盘 ---"
          df -h /

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      - name: 同步到安卓工程
        run: npx cap sync android

      # Windows 上的 Git 不保留可执行位，gradlew 到 Linux 上就没有执行权限。
      # 少了这一行，构建会以 "Permission denied" 失败。
      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 检查产物
        run: ls -lh android/app/build/outputs/apk/debug/

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: softlings-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  # 质量门禁：数值模拟 + 渲染冒烟 + 安卓工程校验。
  # 失败不影响 apk 作业，但会在 Actions 页面标红，保证坏代码不会被忽视。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物（冒烟测试需要 dist）
        run: npm run build

      - name: 跑测试
        run: npm run check
