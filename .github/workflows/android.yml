name: Build Android APK

# 推送到 main 就自动出包；也可以在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 用的是 Android Gradle Plugin 8.x，需要 JDK 17 以上
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      # 缓存 ~/.gradle，第二次之后的构建能快一半以上
      - uses: gradle/actions/setup-gradle@v3

      - name: 安装依赖
        run: npm ci

      - name: 构建 Web 产物
        run: npm run build

      # 先跑测试再打包：坏代码不该产出 APK。
      # 数值模拟器是纯 Node，渲染冒烟测试用 ubuntu-latest 预装的 Chrome。
      - name: 跑测试（数值模拟 + 渲染冒烟 + 安卓工程校验）
        run: npm run check

      - name: 同步到安卓工程
        run: npx cap sync android

      # Windows 上的 Git 不保留可执行位，gradlew 到 CI 里就没有执行权限了。
      # 少了这一行，构建会以 "Permission denied" 直接失败。
      - name: 赋予 gradlew 执行权限
        run: chmod +x android/gradlew

      - name: 编译 Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: softlings-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          # 构建产物保留 30 天；下载地址在 Actions 运行页面的 Artifacts 区
          retention-days: 30
